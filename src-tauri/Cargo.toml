[package]
name = "warble"
version = "0.1.0"
description = "Warble photo viewer"
authors = ["you"]
edition = "2021"

[lib]
name = "warble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
kamadak-exif = "0.6"
jpeg-decoder = "0.3"
fast_image_resize = { version = "5", features = ["image"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
tokio = { version = "1", features = ["sync"] }
rawler = "0.7"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-folder-access = { path = "plugins/folder-access" }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
trash = "5"

# Even in dev builds, run the imaging crates with full optimisation —
# debug-built JPEG decode + SIMD resize is an order of magnitude slower
# than release, which makes a 24 MP HD preview take ~30 s instead of
# 1–2 s. Our own code stays at the default `opt-level = 0` so it still
# builds and steps through quickly.
[profile.dev.package."*"]
opt-level = 3
